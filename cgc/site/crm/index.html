<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CGC Team | Lead Desk</title><link rel="icon" href="/assets/favicon.ico"><style>
:root{color-scheme:dark;--bg:#0a0b0d;--panel:#111317;--line:#262a31;--fg:#f3f4f6;--mute:#a3a8b0;--amber:#faac1a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,.button{min-height:44px;min-width:44px;padding:10px 14px;border:1px solid var(--line);border-radius:4px;background:var(--panel);cursor:pointer}a{color:inherit;overflow-wrap:anywhere}button.active,.primary{background:var(--amber);color:#0a0b0d}input,select,textarea{display:block;width:100%;min-height:44px;padding:10px;border:1px solid #636466;background:var(--bg);border-radius:0;font-size:16px}label{display:block;margin:12px 0}header{border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:26px;margin:0}h2{font-size:21px}small,.muted{color:var(--mute)}main{padding:20px;max-width:1600px;margin:auto}.tools,nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tools label{margin:0;flex:1 1 180px}.notice{padding:16px;border:1px solid var(--line);margin-bottom:16px;font-family:monospace}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px}.column{border:1px solid var(--line);background:var(--panel);padding:12px;min-width:0}.column h2{font-size:14px;font-family:monospace}.card{width:100%;text-align:left;display:block;border-radius:0;margin:8px 0;background:var(--bg);overflow-wrap:anywhere}.card strong,.card small{display:block}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:24px}.metric{background:var(--panel);padding:20px}.metric strong{display:block;font:28px monospace}dialog{background:var(--panel);color:var(--fg);border:1px solid #636466;width:min(620px,calc(100% - 24px));max-height:90dvh;padding:24px}dialog::backdrop{background:#000c}#auth{max-width:480px;margin:50px auto}#drawer{margin-right:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.span{grid-column:1/-1}pre{white-space:pre-wrap;overflow-wrap:anywhere}#status{white-space:pre-wrap}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid white;outline-offset:3px}.list .card{display:grid;grid-template-columns:2fr 1fr;gap:8px}.hide,[hidden]{display:none!important}@media(max-width:480px){main{padding:12px}dialog{padding:16px}.grid{grid-template-columns:1fr}.span{grid-column:auto}header{padding:12px}}
</style></head><body><header><h1>CGC / Lead desk</h1><a class="button" href="/">Website</a><button id="logout" hidden>Lock desk</button></header><main><section id="auth"><p class="muted">Team access. Your key is kept in memory for this tab only.</p><form id="login"><label for="key">CRM key<input id="key" type="password" autocomplete="off" required></label><button class="primary">Unlock desk</button></form><p>Look around without accessing client records.</p><button id="demo">Open SAMPLE-data demo</button></section><section id="app" hidden><div id="mode" class="notice"></div><nav aria-label="Desk views"><button data-view="pipeline" class="active">Pipeline</button><button data-view="service">Service lane</button><button data-view="list">List</button><button data-view="today">Today</button><button data-view="metrics">Metrics</button></nav><div class="tools"><label>Search leads<input id="search" type="search"></label><button id="new">New lead</button><button id="refresh">Refresh</button><button id="export">Export CSV</button><button id="import">Import CSV</button><label>Records<select id="archived"><option value="active">Active</option><option value="archived">Archived</option><option value="all">All</option></select></label></div><input type="file" id="csv" accept=".csv,text/csv" hidden><div id="content"></div></section><p id="status" role="status" aria-live="polite"></p></main><dialog id="drawer" aria-labelledby="drawer-title"><div class="tools"><h2 id="drawer-title">Lead</h2><button id="close">Close</button></div><form id="edit"><div id="fields" class="grid"></div><p id="consent"></p><div class="tools"><button class="primary">Save lead</button><button type="button" id="archive">Archive lead</button></div></form><h2>Follow-up templates</h2><label>Template<select id="template"><option value="plans">Request plans</option><option value="bid">Bid follow-up</option><option value="schedule">Schedule check</option></select></label><label>Draft message<textarea id="draft" rows="5"></textarea></label><div class="tools"><a id="email" class="button">Open email draft</a><a id="call" class="button">Call</a><a id="sms" class="button">Open text draft</a></div><h2>Notes & activity</h2><label>Add note<textarea id="note" maxlength="2000"></textarea></label><button id="addnote">Save note</button><div id="history"></div></dialog><script>
const BID=['lead','plans','takeoff','bid-sent','follow-up','awarded','lost','submittals','glass-ordered','install-scheduled','installed-punch','invoiced-retention','closed'],SVC=['svc-new','svc-scheduled','svc-done','svc-invoiced'];
const LABEL={'lead':'Lead','plans':'Plans received','takeoff':'Estimating','bid-sent':'Bid sent','follow-up':'Follow-up','awarded':'Awarded','lost':'Lost','submittals':'Submittals','glass-ordered':'Glass ordered','install-scheduled':'Install scheduled','installed-punch':'Installed / Punch','invoiced-retention':'Invoiced / Retention','closed':'Closed','svc-new':'Service: New','svc-scheduled':'Service: Scheduled','svc-done':'Service: Done','svc-invoiced':'Service: Invoiced'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let key='',demo=false,records=[],view='pipeline',current=null;
const status=t=>$('#status').textContent=t,today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)},dollars=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n||0);
async function api(method='GET',body){const r=await fetch('/api/leads',{method,headers:{'Content-Type':'application/json','x-crm-key':key},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Request failed');return j}
function sample(){return ['lead','plans','bid-sent','awarded','svc-new','svc-scheduled'].map((stage,i)=>({id:'sample-'+i,name:'SAMPLE Contact '+(i+1),company:'SAMPLE Contractor',title:['Storefront opening','Office partition','Entrance replacement','Tenant improvement','Door closer service','Glass service'][i],email:'sample@example.com',phone:'',projectType:i>3?'service-repair':'storefront',role:'GC',scope:'SAMPLE record for demonstration only.',stage,lane:i>3?'service':'bid',bidDue:today(),nextFollowUp:today(),lastTouchAt:new Date(Date.now()-12*86400000).toISOString(),createdAt:new Date().toISOString(),bidAmount:10000*(i+1),awardValue:i===3?40000:null,notes:[],activity:[],archived:false,smsConsent:false}));}
async function load(){if(!demo){const j=await api();records=j.leads;if(j.readErrors)status(j.readErrors+' records could not be read. Refresh before making decisions.')}render();if(location.hash.startsWith('#lead=')){const r=records.find(x=>x.id===location.hash.slice(6));if(r)open(r)}}
function enter(){ $('#auth').hidden=true;$('#app').hidden=false;$('#logout').hidden=false;$('#mode').textContent=demo?'SAMPLE DATA DEMO — fictional records. Changes stay in memory; nothing is sent to the server.':'LIVE DESK — client records. Lock the desk when finished.';}
$('#login').onsubmit=async e=>{e.preventDefault();key=$('#key').value;$('#key').value='';demo=false;try{await load();enter()}catch(e){key='';status(e.message)}};
$('#demo').onclick=()=>{demo=true;records=sample();enter();render();status('')};$('#logout').onclick=()=>{key='';records=[];demo=false;$('#drawer').close();$('#app').hidden=true;$('#auth').hidden=false;$('#logout').hidden=true;status('Desk locked.')};
function filtered(){const q=$('#search').value.toLowerCase(),a=$('#archived').value;return records.filter(r=>(a==='all'||!!r.archived===(a==='archived'))&&[r.name,r.company,r.title,r.city,r.scope].join(' ').toLowerCase().includes(q))}
const card=r=>`<button class="card" data-id="${esc(r.id)}"><strong>${esc(r.title||r.company||r.name)}</strong><span>${esc(r.name)} · ${esc(LABEL[r.stage])}</span><small>${esc(r.city||'City not set')} / Due ${esc(r.bidDue||'—')} / Follow-up ${esc(r.nextFollowUp||'—')}</small></button>`;
function render(){const rows=filtered(),content=$('#content');document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='metrics'){const bid=rows.filter(r=>r.lane==='bid'),decided=bid.filter(r=>r.awardedAt||r.lostAt||['awarded','lost'].includes(r.stage)),won=decided.filter(r=>r.awardedAt||r.stage==='awarded');content.innerHTML=`<h2>Pipeline metrics</h2><p class="muted">Based on filtered records. Win rate = awarded ÷ (awarded + lost). Historical award dates count after a job advances.</p><div class="metrics">${[['Leads',rows.length],['Win rate',decided.length?Math.round(won.length/decided.length*100)+'%':'—'],['Total bid',dollars(rows.reduce((s,r)=>s+Number(r.bidAmount||0),0))],['Total awarded',dollars(rows.reduce((s,r)=>s+Number(r.awardValue||0),0))]].map(([l,v])=>`<div class="metric">${l}<strong>${v}</strong></div>`).join('')}</div>`;return}
if(view==='today'){const groups=[['Bids due / overdue',rows.filter(r=>r.bidDue&&r.bidDue<=today()&&!['closed','lost'].includes(r.stage))],['Follow-ups due',rows.filter(r=>r.nextFollowUp&&r.nextFollowUp<=today())],['Stale bids · no touch for 7 days',rows.filter(r=>['bid-sent','follow-up'].includes(r.stage)&&Date.now()-Date.parse(r.lastTouchAt)>7*86400000)]];content.innerHTML=groups.map(([name,list])=>`<h2>${name} (${list.length})</h2>${list.map(card).join('')||'<p>No items.</p>'}`).join('')}
else if(view==='list')content.innerHTML='<div class="list">'+(rows.map(card).join('')||'<p>No leads. Add one or import a CSV.</p>')+'</div>';
else{const stages=view==='service'?SVC:BID;content.innerHTML='<div class="board">'+stages.map(s=>`<section class="column"><h2>${LABEL[s]} / ${rows.filter(r=>r.stage===s).length}</h2>${rows.filter(r=>r.stage===s).map(card).join('')||'<small>No leads</small>'}</section>`).join('')+'</div>'}
content.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(records.find(r=>r.id===b.dataset.id)))}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('#search').oninput=render;$('#archived').onchange=render;$('#refresh').onclick=()=>load().catch(e=>status(e.message));
const definitions=[['title','Job title'],['name','Contact name'],['company','Company'],['email','Email','email'],['phone','Phone','tel'],['city','City'],['role','Role',['GC','PM','Owner','Architect','Other']],['projectType','Project type',['storefront','curtain-wall','interior-glass','doors','service-repair','other']],['stage','Stage',[...BID,...SVC]],['bidDue','Bid due','date'],['nextFollowUp','Next follow-up','date'],['installDate','Install date','date'],['value','Estimated value','number'],['bidAmount','Bid amount','number'],['awardValue','Award value','number'],['assigned','Assigned to'],['tags','Tags (comma separated)'],['plansLink','Plans URL','url'],['source','Source'],['lostReason','Lost reason'],['scope','Scope','textarea']];
function open(r){current=r?structuredClone(r):{role:'Other',projectType:'storefront',stage:'lead',notes:[],activity:[]};$('#drawer-title').textContent=r?'Lead / '+(r.title||r.name):'New lead';$('#fields').innerHTML=definitions.map(([k,l,t])=>`<label${t==='textarea'?' class="span"':''}>${l}${Array.isArray(t)?`<select name="${k}">${t.map(v=>`<option value="${v}" ${current[k]===v?'selected':''}>${esc(LABEL[v]||v)}</option>`).join('')}</select>`:t==='textarea'?`<textarea name="${k}" rows="4">${esc(current[k])}</textarea>`:`<input name="${k}" type="${t||'text'}" ${t==='number'?'min="0" step="0.01"':''} value="${esc(Array.isArray(current[k])?current[k].join(', '):current[k])}">`}</label>`).join('');$('#archive').hidden=!r;$('#archive').textContent=current.archived?'Restore lead':'Archive lead';$('#consent').textContent=current.smsConsent?'Text consent recorded '+(current.smsConsentAt||''):'No recorded text consent. Use phone or email.';$('#note').value='';$('#history').innerHTML=[...(current.notes||[]).map(n=>`${n.at} / ${n.by}: ${n.text}`),...(current.activity||[]).map(a=>`${a.at}: ${a.text}`)].reverse().map(s=>`<p>${esc(s)}</p>`).join('');draft();if(!$('#drawer').open)$('#drawer').showModal()}
$('#new').onclick=()=>open(null);$('#close').onclick=()=>$('#drawer').close();
async function save(patch){if(demo){if(current.id){Object.assign(current,patch);if(patch.stage){current.lane=SVC.includes(patch.stage)?'service':'bid';if(patch.stage==='awarded')current.awardedAt=new Date().toISOString();if(patch.stage==='lost')current.lostAt=new Date().toISOString()}}else current={...current,...patch,id:'sample-'+Date.now(),lane:SVC.includes(patch.stage)?'service':'bid',createdAt:new Date().toISOString()};if(patch.appendNote){current.notes.push({at:new Date().toISOString(),by:'demo',text:patch.appendNote});delete current.appendNote}current.lastTouchAt=new Date().toISOString();const i=records.findIndex(r=>r.id===current.id);if(i<0)records.unshift(current);else records[i]=current;}else{const result=await api(current.id?'PATCH':'POST',{...(current.id?{id:current.id}:{}),...patch});current=result.lead;if(result.fields||result.warnings)status('Saved with field warnings: '+JSON.stringify(result.fields||result.warnings));await load()}render();return current}
$('#edit').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));if(!p.name&&!p.company&&!p.title){status('Enter a contact, company or job title.');return}try{await save(p);$('#drawer').close();status('Lead saved.')}catch(e){status(e.message)}};$('#archive').onclick=async()=>{try{await save({archived:!current.archived});$('#drawer').close();status(current.archived?'Lead archived.':'Lead restored.')}catch(e){status(e.message)}};$('#addnote').onclick=async()=>{if(!current.id)return status('Save the lead before adding notes.');if(!$('#note').value.trim())return status('Enter a note.');try{open(await save({appendNote:$('#note').value}));status('Note saved.')}catch(e){status(e.message)}};
function draft(){const n=current.name||'there',job=current.title||current.projectType||'project',messages={plans:`Hi ${n}, please send the plans, project city, scope and bid due date for ${job}. Thank you, Nathan / Commercial Glazing Contractors Inc.`,bid:`Hi ${n}, checking on our glazing bid for ${job}. Are there scope revisions or a decision date we should know about? Nathan / Commercial Glazing Contractors Inc.`,schedule:`Hi ${n}, please confirm the opening readiness and target install date for ${job}. Nathan / Commercial Glazing Contractors Inc.`};$('#draft').value=messages[$('#template').value];links()}
function links(){$('#email').href=current.email?'mailto:'+encodeURIComponent(current.email)+'?subject='+encodeURIComponent('Glazing / '+(current.title||'project'))+'&body='+encodeURIComponent($('#draft').value):'mailto:nathan@cgcontractorsinc.com';$('#call').hidden=!current.phone;$('#call').href='tel:'+String(current.phone||'').replace(/[^+\d]/g,'');$('#sms').hidden=!current.smsConsent||!current.phone;$('#sms').href='sms:'+String(current.phone||'').replace(/[^+\d]/g,'')+'?body='+encodeURIComponent($('#draft').value)}$('#template').onchange=draft;$('#draft').oninput=links;
const CSVFIELDS=['name','company','title','email','phone','role','projectType','city','scope','plansLink','stage','bidDue','nextFollowUp','installDate','value','bidAmount','awardValue','assigned','tags','source','lostReason','createdAt','bidSentAt','awardedAt','lostAt','lastTouchAt','stageChangedAt','notes'];
$('#export').onclick=()=>{const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const data=[CSVFIELDS,...filtered().map(r=>CSVFIELDS.map(k=>{let v=k==='notes'?(r.notes||[]).map(n=>n.text).join('\n'):Array.isArray(r[k])?r[k].join(','):r[k];return typeof v==='string'&&/^[=+@\-\t\r]/.test(v)?"'"+v:v}))].map(row=>row.map(quote).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=demo?'cgc-SAMPLE-leads.csv':'cgc-leads.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
function parseCSV(s){const rows=[];let row=[],v='',quoted=false;s=s.replace(/^\uFEFF/,'');for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.some(Boolean))rows.push(row);row=[];v=''}else v+=c}if(quoted)throw Error('Unclosed CSV quote.');row.push(v);if(row.some(Boolean))rows.push(row);const headers=rows.shift()||[];return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]||'']).filter(([h])=>CSVFIELDS.includes(h))))}
$('#import').onclick=()=>$('#csv').click();$('#csv').onchange=async e=>{try{const rows=parseCSV(await e.target.files[0].text());if(!rows.length||rows.length>1000)throw Error('Import needs 1–1000 rows with named columns.');if(demo){for(const r of rows)records.push({...r,id:'sample-'+Date.now()+'-'+Math.random(),notes:r.notes?[{text:r.notes}]:[],activity:[],lane:SVC.includes(r.stage)?'service':'bid',stage:[...BID,...SVC].includes(r.stage)?r.stage:'lead'});render();status(rows.length+' SAMPLE rows imported.')}else{const j=await api('POST',{import:rows});await load();status(j.created+' rows imported. '+JSON.stringify(j.errors||[]))}}catch(e){status(e.message)}finally{e.target.value=''}};
</script></body></html>
